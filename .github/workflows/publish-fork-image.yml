name: Publish fork image

# Builds Mealie from the selected ref and publishes it to this repository's ghcr.io package
# (ghcr.io/<owner>/mealie). Meant for forks: it needs no Docker Hub or Depot credentials,
# only the GITHUB_TOKEN. Run it manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag, and the version shown in the app
        required: true
        default: multi-household
        type: string
      ref:
        description: Branch, tag or commit to build (defaults to the branch the workflow runs on)
        required: false
        type: string

jobs:
  build-package:
    name: Build Package
    uses: ./.github/workflows/build-package.yml
    with:
      tag: ${{ inputs.tag }}
      ref: ${{ inputs.ref }}

  publish:
    name: Build and push image
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to the Container registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # the action lowercases the image name, which ghcr.io requires
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}

      - name: Retrieve Python package
        uses: actions/download-artifact@v6
        with:
          name: backend-dist
          path: dist

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile
          context: .
          build-contexts: |
            packages=dist
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ inputs.ref || github.sha }}
